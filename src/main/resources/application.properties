spring.application.name=hotel-service
server.port=8081
spring.profile= local

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_service
spring.datasource.username=root
spring.datasource.password=Navin@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect (Optional for newer Spring Boot versions)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

Kafka.bootstrap-servers=localhost:9092
auto.create.topics.enable=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=hotel-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.relaxstay.hotel_service.entity